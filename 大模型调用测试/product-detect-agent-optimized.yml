app:
  description: '优化版汽车外饰件视觉质检Agent - 7节点多阶段检测架构'
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: product-detect-agent-v2-optimized
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      image:
        enabled: true
        number_limits: 5
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 5
    opening_statement: '您好！我是优化版AI视觉质检专家。请上传汽车外饰件图片，我将为您提供多阶段专业检测分析。'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - '这个零件有什么缺陷？'
    - '能详细说明检测到的问题吗？'
    - '这个产品能通过质检吗？'
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    # Start -> 图像预处理
    - data:
        sourceType: start
        targetType: code
      id: start-preprocessing
      source: '1755792297982'
      sourceHandle: source
      target: image_preprocessing
      targetHandle: target
      type: custom

    # 图像预处理 -> 质量检查条件
    - data:
        sourceType: code
        targetType: if-else
      id: preprocessing-quality-check
      source: image_preprocessing
      sourceHandle: source
      target: quality_check
      targetHandle: target
      type: custom

    # 质量检查True -> 缺陷分类器
    - data:
        sourceType: if-else
        targetType: llm
      id: quality-check-true-classifier
      source: quality_check
      sourceHandle: 'true'
      target: defect_classifier
      targetHandle: target
      type: custom

    # 质量检查False -> 低质量提示
    - data:
        sourceType: if-else
        targetType: answer
      id: quality-check-false-answer
      source: quality_check
      sourceHandle: 'false'
      target: low_quality_answer
      targetHandle: target
      type: custom

    # 缺陷分类器 -> 表面检测
    - data:
        sourceType: llm
        targetType: llm
      id: classifier-surface
      source: defect_classifier
      sourceHandle: source
      target: surface_detection
      targetHandle: target
      type: custom

    # 缺陷分类器 -> 结构检测
    - data:
        sourceType: llm
        targetType: llm
      id: classifier-structural
      source: defect_classifier
      sourceHandle: source
      target: structural_detection
      targetHandle: target
      type: custom

    # 缺陷分类器 -> 涂装检测
    - data:
        sourceType: llm
        targetType: llm
      id: classifier-coating
      source: defect_classifier
      sourceHandle: source
      target: coating_detection
      targetHandle: target
      type: custom

    # 三个检测节点 -> 结果聚合
    - data:
        sourceType: llm
        targetType: code
      id: surface-aggregation
      source: surface_detection
      sourceHandle: source
      target: result_aggregation
      targetHandle: target
      type: custom

    - data:
        sourceType: llm
        targetType: code
      id: structural-aggregation
      source: structural_detection
      sourceHandle: source
      target: result_aggregation
      targetHandle: target
      type: custom

    - data:
        sourceType: llm
        targetType: code
      id: coating-aggregation
      source: coating_detection
      sourceHandle: source
      target: result_aggregation
      targetHandle: target
      type: custom

    # 结果聚合 -> 质量审核
    - data:
        sourceType: code
        targetType: llm
      id: aggregation-review
      source: result_aggregation
      sourceHandle: source
      target: quality_review
      targetHandle: target
      type: custom

    # 质量审核 -> 最终输出
    - data:
        sourceType: llm
        targetType: answer
      id: review-answer
      source: quality_review
      sourceHandle: source
      target: final_answer
      targetHandle: target
      type: custom

    nodes:
    # ==================== 节点1: 开始 ====================
    - data:
        desc: '上传产品图片进行质检'
        selected: false
        title: 开始
        type: start
        variables:
        - allowed_file_extensions: []
          allowed_file_types:
          - image
          allowed_file_upload_methods:
          - local_file
          - remote_url
          label: product_image
          max_length: 48
          options: []
          required: true
          type: file
          variable: product_image
      height: 90
      id: '1755792297982'
      position:
        x: 80
        y: 300
      positionAbsolute:
        x: 80
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    # ==================== 节点2: 图像预处理 ====================
    - data:
        code: |
          import json

          def main(product_image: dict) -> dict:
              """
              图像预处理节点
              功能：质量检查、元数据提取
              """

              # 模拟图像质量检查（实际应使用cv2等库）
              # 由于Dify Code节点限制，这里简化处理

              # 提取文件信息
              file_id = product_image.get('id', '')
              file_name = product_image.get('name', '')

              # 简化的质量评分（实际应分析图像）
              # 假设所有图像质量合格，实际部署时需要真实检测
              quality_pass = True
              quality_score = 0
              quality_issues = []

              # 模拟元数据
              metadata = {
                  "file_id": file_id,
                  "file_name": file_name,
                  "quality_score": quality_score,
                  "quality_issues": quality_issues,
                  "brightness": 128,  # 模拟值
                  "sharpness": 150,   # 模拟值
                  "width": 1920,      # 模拟值
                  "height": 1080      # 模拟值
              }

              return {
                  "quality_pass": quality_pass,
                  "metadata": json.dumps(metadata, ensure_ascii=False),
                  "preprocessing_notes": "图像预处理完成，质量检查通过" if quality_pass else "图像质量不佳，建议重新拍摄"
              }
        code_language: python3
        desc: '检查图像质量并提取元数据'
        outputs:
          quality_pass:
            type: boolean
          metadata:
            type: string
          preprocessing_notes:
            type: string
        selected: false
        title: 图像预处理
        type: code
        variables:
        - value_selector:
          - '1755792297982'
          - product_image
          variable: product_image
      height: 90
      id: image_preprocessing
      position:
        x: 380
        y: 300
      positionAbsolute:
        x: 380
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    # ==================== 节点3: 质量检查条件 ====================
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: '='
            id: quality_condition
            value: true
            variable_selector:
            - image_preprocessing
            - quality_pass
          logical_operator: and
        desc: '根据图像质量决定是否继续检测'
        logical_operator: and
        selected: false
        title: 质量检查
        type: if-else
      height: 126
      id: quality_check
      position:
        x: 680
        y: 300
      positionAbsolute:
        x: 680
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    # ==================== 节点4: 低质量图像提示 ====================
    - data:
        answer: |
          ⚠️ 图像质量检查未通过

          **问题说明**：
          {{#image_preprocessing.preprocessing_notes#}}

          **建议**：
          1. 确保图像分辨率至少800x800像素
          2. 确保光照充足且均匀
          3. 确保图像清晰，避免模糊
          4. 重新拍摄后再次上传

          如有疑问，请联系技术支持。
        desc: '图像质量不合格时的提示'
        selected: false
        title: 低质量提示
        type: answer
        variables: []
      height: 107
      id: low_quality_answer
      position:
        x: 980
        y: 480
      positionAbsolute:
        x: 980
        y: 480
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    # ==================== 节点5: 缺陷分类器 ====================
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: '将缺陷初步分类到三大类别'
        memory:
          query_prompt_template: ''
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 50
        model:
          completion_params:
            max_tokens: 2000
            temperature: 0.3
          mode: chat
          name: gemini-3-pro-preview
          provider: google
        prompt_template:
        - id: classifier_system
          role: system
          text: |
            # 角色
            你是一位汽车外饰件缺陷分类专家。

            # 任务
            请对上传的图片进行初步分析，将可能存在的缺陷分类到以下三个类别：

            1. **表面缺陷** (Surface Defects)
               - 贴纸、标签异常（缺失、位置偏移、破损）
               - 污渍、指纹
               - 表面污染物

            2. **结构缺陷** (Structural Defects)
               - 划伤、划痕（线性损伤）
               - 磕伤、凹痕（冲击损伤）
               - 裂纹、破损
               - 顶包（凸起）、缩痕（凹陷）
               - 变形

            3. **涂装缺陷** (Coating Defects)
               - 橘皮纹理（表面波纹）
               - 流挂（涂料流淌）
               - 颗粒、尘点
               - 缩孔、针孔（圆形小坑）
               - 抛光印（光泽不均）
               - 色差

            # 图像质量信息
            {{#image_preprocessing.preprocessing_notes#}}

            # 输出要求
            请以JSON格式输出你的分析结果（必须严格遵循以下格式）：
            ```json
            {
              "primary_category": "表面缺陷",
              "confidence": 0.85,
              "detected_categories": ["表面缺陷", "结构缺陷"],
              "visual_features": "图像显示黑色高光泽表面，可见斑马纹反射条纹，右侧区域有线性痕迹",
              "recommendation": "建议进行表面检测和结构检测"
            }
            ```

            # 注意事项
            1. 一张图片可能包含多个类别的缺陷，请在detected_categories中列出所有可能的类别
            2. primary_category是你认为最主要的缺陷类别
            3. confidence表示你的分类置信度（0.0-1.0）
            4. visual_features简要描述图像特征（50字以内）
            5. recommendation说明建议进行的专项检测
            6. **必须输出纯JSON格式，不要有其他文字**
        selected: false
        title: 缺陷分类器
        type: llm
        variables: []
        vision:
          configs:
            detail: high
            variable_selector:
            - '1755792297982'
            - product_image
          enabled: true
      height: 90
      id: defect_classifier
      position:
        x: 980
        y: 300
      positionAbsolute:
        x: 980
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    # ==================== 节点6: 表面缺陷检测 ====================
    - data:
        context:
          enabled: false
        desc: '专项检测：贴纸、标签、表面污染'
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
        model:
          completion_params:
            max_tokens: 2000
            temperature: 0.2
          mode: chat
          name: gemini-3-pro-preview
          provider: google
        prompt_template:
        - id: surface_system
          role: system
          text: |
            # 角色
            你是贴纸、标签和表面污染物检测专家。

            # 专项检测：表面缺陷

            ## 分类器分析结果
            {{#defect_classifier.text#}}

            ## 重点关注（当前漏检严重）
            1. **贴纸/标签异常**
               - 贴纸缺失：应有贴纸的位置没有贴纸
               - 贴纸位置偏移：贴纸位置不正确
               - 贴纸破损、起泡
               - 贴纸印刷模糊

            2. **表面污染**
               - 污渍、油渍
               - 指纹、手印
               - 灰尘积累
               - 水渍、水痕

            ## 检测要点
            - 汽车零部件通常在特定位置（边角、侧面、底部）有生产标签、条形码或警告标签
            - 对于黑色或深色表面，贴纸特别容易被忽视，请仔细观察每个角落
            - 贴纸可能是白色、银色或透明的

            ## 误报预防
            **以下情况不是表面缺陷**：
            - 光泽反射（斑马纹条纹）
            - 产品本身的纹理或图案
            - 正常的接缝线或分模线
            - 产品表面的哑光或磨砂效果

            ## 输出格式
            请输出纯JSON格式（不要有其他文字）：
            ```json
            {
              "defects": [
                {
                  "type": "贴纸",
                  "subtype": "贴纸缺失",
                  "location": "产品右下角",
                  "description": "应有产品标签的位置未发现贴纸",
                  "severity": "严重",
                  "confidence": 0.85,
                  "evidence": "该位置通常应有生产标签或条形码"
                }
              ],
              "no_defect_reason": ""
            }
            ```

            如果未发现缺陷，输出：
            ```json
            {
              "defects": [],
              "no_defect_reason": "未发现明显的表面缺陷，产品表面清洁，未发现贴纸异常"
            }
            ```
        selected: false
        title: 表面缺陷检测
        type: llm
        variables: []
        vision:
          configs:
            detail: high
            variable_selector:
            - '1755792297982'
            - product_image
          enabled: true
      height: 90
      id: surface_detection
      position:
        x: 1280
        y: 150
      positionAbsolute:
        x: 1280
        y: 150
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    # ==================== 节点7: 结构缺陷检测 ====================
    - data:
        context:
          enabled: false
        desc: '专项检测：划伤、磕伤、顶包、缩痕'
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
        model:
          completion_params:
            max_tokens: 2000
            temperature: 0.2
          mode: chat
          name: gemini-3-pro-preview
          provider: google
        prompt_template:
        - id: structural_system
          role: system
          text: |
            # 角色
            你是机械结构和物理损伤检测专家。

            # 专项检测：结构缺陷

            ## 分类器分析结果
            {{#defect_classifier.text#}}

            ## 重点关注
            1. **划伤/划痕**（当前表现最好，保持）
               - 线状划痕（浅层）
               - 深度划伤（可见底材）
               - 擦伤痕迹

            2. **机械损伤**（当前完全漏检）
               - 磕伤：冲击导致的局部凹陷或材料缺失，形状不规则
               - 撞痕：较大面积的形变
               - 压痕：受压产生的凹坑

            3. **材料缺陷**（易混淆，需明确区分）
               - **顶包**：表面向外凸起，边缘圆滑，通常较大(>2mm)
               - **缩痕**：表面向内凹陷，边缘清晰
               - 裂纹：材料断裂形成的缝隙

            ## 关键识别要点

            ### 顶包 vs 缩孔
            - **顶包**：凸起（鼓包），较大，边缘圆滑
            - **缩孔**：凹陷（坑），较小，圆形

            ### 磕伤 vs 划伤
            - **磕伤**：不规则形状，边缘粗糙，可能有材料缺失或变色
            - **划伤**：线状，边缘整齐，连续的痕迹

            ## 误报预防
            **以下不是结构缺陷**：
            - 正常的橘皮纹理（属于涂装缺陷）
            - 产品设计的圆弧或曲面（非变形）
            - 光线造成的阴影（非真实凹陷）
            - 斑马纹条纹（检测光源）

            ## 输出格式
            请输出纯JSON格式：
            ```json
            {
              "defects": [
                {
                  "type": "划伤",
                  "location": "左侧边缘，距离顶部约5cm",
                  "description": "长约8mm的线性划伤，未露底材",
                  "severity": "中等",
                  "confidence": 0.90,
                  "dimension": "长8mm×宽0.2mm"
                }
              ],
              "no_defect_reason": ""
            }
            ```

            类型必须从以下选择：划伤、磕伤、顶包、缩痕、裂纹
        selected: false
        title: 结构缺陷检测
        type: llm
        variables: []
        vision:
          configs:
            detail: high
            variable_selector:
            - '1755792297982'
            - product_image
          enabled: true
      height: 90
      id: structural_detection
      position:
        x: 1280
        y: 300
      positionAbsolute:
        x: 1280
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    # ==================== 节点8: 涂装缺陷检测 ====================
    - data:
        context:
          enabled: false
        desc: '专项检测：颗粒、缩孔、抛光印、橘皮'
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
        model:
          completion_params:
            max_tokens: 2000
            temperature: 0.2
          mode: chat
          name: gemini-3-pro-preview
          provider: google
        prompt_template:
        - id: coating_system
          role: system
          text: |
            # 角色
            你是汽车涂装质量检测专家。

            # 专项检测：涂装缺陷

            ## 分类器分析结果
            {{#defect_classifier.text#}}

            ## 重点关注
            1. **颗粒/尘点**（当前召回率80%但误报多）
               - 异色颗粒：与基材颜色不同的杂质点（直径≥0.3mm判NG）
               - 同色颗粒：与基材颜色相同的凸起点（直径≥1.0mm判NG）
               - 注意：金属漆的金属闪光点**不是缺陷**

            2. **涂层问题**
               - 缩孔/针孔：涂层中的小圆形凹坑
               - **抛光印**：抛光不均留下的光泽度差异或云雾状色差（当前完全漏检）
               - 流挂：涂料流淌形成的垂直条纹或水滴状

            3. **表面质感**（高误报区域）
               - 橘皮：涂层表面的波纹纹理

            ## 关键判断标准

            ### 橘皮的正常范围（重要！）
            轻微橘皮是**正常现象**，**不应判定为缺陷**，除非：
            - 橘皮严重不均匀（局部特别粗糙）
            - 橘皮特别明显（肉眼可见大波纹）
            - 产品标注为A级表面且要求极高

            **如果橘皮在正常范围内，必须在no_defect_reason中说明"橘皮纹理在正常范围内"**

            ### 抛光印的识别（当前漏检）
            - 局部光泽度明显不一致
            - 呈现云雾状、波浪状或环形的色差
            - 通常在曲面或边缘区域
            - 在不同角度观察时明显

            ### 颗粒判定
            - 必须是明确的凸起或异色点
            - 金属漆的均匀闪光点不是缺陷
            - 尺寸超标才报告

            ## 误报预防（当前误报最严重）
            **以下情况绝对不是缺陷**：
            - 轻微且均匀的橘皮纹理
            - 斑马纹灯光的条纹反射（这是检测工具）
            - 产品的哑光或磨砂设计效果
            - 金属漆的正常闪光点
            - 轻微的光线阴影

            ## 检测策略
            1. 首先判断橘皮是否明显超标（如无，说明在正常范围）
            2. 区分金属闪光点和真正的颗粒缺陷
            3. 仔细查找抛光印（光泽不均）
            4. **只报告明确的、超出标准的缺陷**

            ## 输出格式
            请输出纯JSON格式：
            ```json
            {
              "defects": [
                {
                  "type": "颗粒",
                  "subtype": "异色颗粒",
                  "location": "正面中央区域",
                  "description": "白色异色颗粒，直径约0.5mm，凸起明显",
